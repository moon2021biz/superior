<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜陸上クラブ SUPERIOR（スペリオール）</title>
<meta name="description" content="お探しのページは見つかりませんでした。陸上クラブSUPERIOR（スペリオール）のトップページから、スクール情報・無料体験のお申し込みへお進みください。">
<meta name="robots" content="noindex, follow">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --black:#0D0D0D; --gray2:#444; --gray3:#888; --gray4:#C8C8C8; --gray5:#F2F0ED;
    --white:#FFFFFF; --gold:#B89A5A;
  }
  body{
    font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
    background:var(--white); color:var(--black); line-height:1.75;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:inherit;text-decoration:none}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 clamp(18px,5vw,48px); height:68px;
    border-bottom:1px solid rgba(0,0,0,0.08);
  }
  .logo{font-weight:800;letter-spacing:3px;font-size:15px}
  .back{font-size:11.5px;letter-spacing:1px;color:var(--gray3)}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px clamp(18px,5vw,48px)}
  .inner{max-width:620px;width:100%;text-align:center}

  .code{
    font-size:clamp(64px,16vw,104px); font-weight:900; letter-spacing:4px;
    line-height:1; color:var(--gold);
  }
  .code span{color:var(--gray4)}
  h1{margin-top:18px;font-size:clamp(17px,4.4vw,21px);font-weight:800;letter-spacing:1.5px}
  .lead{margin-top:16px;font-size:13.5px;line-height:2.1;color:var(--gray2)}

  .links{margin-top:34px;display:grid;gap:12px}
  .card{
    display:block; padding:16px 20px; border:1px solid rgba(0,0,0,.10); border-radius:6px;
    text-align:left; transition:border-color .2s ease, background .2s ease;
  }
  .card:hover{border-color:var(--gold);background:var(--gray5)}
  .card .t{font-size:14px;font-weight:800;letter-spacing:1px}
  .card .d{font-size:11.5px;color:var(--gray3);margin-top:4px}
  .card.is-trial{background:#E8502E;border-color:#E8502E;color:var(--white);text-align:center}
  .card.is-trial:hover{background:#cf4526;border-color:#cf4526}
  .card.is-trial .d{color:rgba(255,255,255,.85)}

  footer{
    padding:26px clamp(18px,5vw,48px) 40px; text-align:center;
    font-size:11.5px; line-height:2; color:var(--gray3);
    border-top:1px solid rgba(0,0,0,.06);
  }
  @media(max-width:680px){
    header{height:60px}
    main{padding:40px 18px}
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">SUPERIOR</a>
  <a href="/" class="back">← トップへ戻る</a>
</header>

<main>
  <div class="inner">
    <p class="code">4<span>0</span>4</p>
    <h1>ページが見つかりませんでした</h1>
    <p class="lead">
      お探しのページは、移動または削除された可能性があります。<br>
      お手数ですが、下記よりお進みください。
    </p>

    <div class="links">
      <a class="card is-trial" href="/#apply">
        <div class="t">無料体験・お問い合わせ</div>
        <div class="d">生駒スクール（奈良）／箕面スクール（大阪）</div>
      </a>
      <a class="card" href="/">
        <div class="t">トップページ</div>
        <div class="d">クラブの紹介・コーチ・料金・よくあるご質問</div>
      </a>
      <a class="card" href="/#schedule">
        <div class="t">お知らせコーナー</div>
        <div class="d">各スクールの曜日・時間・空き状況</div>
      </a>
      <a class="card" href="/#venues">
        <div class="t">会場</div>
        <div class="d">生駒市総合公園体育館／箕面 RANDC</div>
      </a>
    </div>
  </div>
</main>

<footer>
  陸上クラブ SUPERIOR（スペリオール）<br>
  Email：<a href="mailto:superior.nara@gmail.com" style="color:var(--gold)">superior.nara@gmail.com</a><br>
  <a href="/superior-kitei" style="color:var(--gray4)">会員規定</a>
</footer>

</body>
</html>
